name: Feature request
about: Suggest an idea for this project
labels: enhancement

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem are you solving?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe your expected behavior.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
