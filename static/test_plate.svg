<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" width="440" height="100">
  <defs>
    <clipPath id="cp"><rect width="440" height="100" rx="8"/></clipPath>
  </defs>
  <!-- زمینه -->
  <rect width="440" height="100" rx="8" fill="#f2ede0"/>
  <!-- نوار آبی بالا/پایین -->
  <rect x="0" y="0" width="440" height="5" fill="#1f3c89" clip-path="url(#cp)"/>
  <rect x="0" y="95" width="440" height="5" fill="#1f3c89" clip-path="url(#cp)"/>
  <!-- نوار آبی سمت راست (IRAN) -->
  <rect x="378" y="0" width="62" height="100" fill="#1f3c89" clip-path="url(#cp)"/>
  <!-- پرچم -->
  <rect x="386" y="13" width="46" height="9" rx="1" fill="#239f40"/>
  <rect x="386" y="22" width="46" height="9" fill="#ffffff"/>
  <rect x="386" y="31" width="46" height="9" rx="1" fill="#da0e15"/>
  <!-- IR -->
  <text x="409" y="55" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1.5">IR</text>
  <!-- IRAN -->
  <text x="409" y="66" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#ffffff" letter-spacing="2">IRAN</text>
  <!-- suffix: 66 -->
  <text x="409" y="88" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#ffffff">66</text>

  <!-- 24 — سمت چپ -->
  <text x="68" y="71" text-anchor="middle" font-family="Arial" font-size="52" font-weight="900" fill="#1a1a1a">24</text>
  <!-- ن -->
  <text x="160" y="71" text-anchor="middle" font-family="Arial" font-size="52" font-weight="700" fill="#1a1a1a">&#x646;</text>
  <!-- خط جداکننده -->
  <line x1="205" y1="12" x2="205" y2="88" stroke="#9d9d9c" stroke-width="1.5"/>
  <!-- 144 — سمت راست بدنه -->
  <text x="300" y="71" text-anchor="middle" font-family="Arial" font-size="52" font-weight="900" fill="#1a1a1a">144</text>

  <!-- border -->
  <rect width="440" height="100" rx="8" fill="none" stroke="#1a1a1a" stroke-width="2"/>
</svg>
